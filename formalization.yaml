version: v0.4
project:
  name: Centrally-Excited-Random-Walk
  description: A Lean 4 formalization of Limit shapes for centrally excited walks (Bou-Rabee, Nguyen,
    Peres, Singh), retaining the earlier two-author source pin and proofs. Every labeled result is proved,
    including the simultaneous crossing estimate, the literal Section 5.1 event probability, and both
    full event source closures.
  authors:
  - Ahmed Bou-Rabee
  - Tuan-Minh Nguyen
  - Yuval Peres
  - Arvind Singh
  license: Apache-2.0
classification:
  arxiv:
  - math.PR
  msc2020:
  - 60K35
  - 60G50
  - 60G42
  - 31C20
sources:
- title: Limit shapes for centrally excited walks
  authors:
  - Ahmed Bou-Rabee
  - Tuan-Minh Nguyen
  - Yuval Peres
  - Arvind Singh
  type: manuscript
  location: paper/oct23.tex
  sha256: 723911323a60e7af6b0f5adef6b56fb0fd542afd72fbf425c30ca8a211929745
  relationship: formalizes (current source)
  note: Every labeled theorem, lemma and proposition is proved by the argument printed in the paper. Results
    whose statement and printed proof are unchanged from the earlier source reuse its formal proofs.
- title: Kozma's centrally excited walk converges to a Euclidean ball
  authors:
  - Ahmed Bou-Rabee
  - Yuval Peres
  type: manuscript
  location: paper/limit-shapes.tex
  relationship: formalizes (preserved source pin)
  note: Theorems 1.1, 1.2, 1.3 and 2.1 and every lemma and proposition of Sections 2-9 are formalized.
  sha256: 0771c8808b3b1f50a0131433c190ce07f908eadd7d2b3145d8f86589be2f9396
status:
  scope: The preserved ledger/manifest.yaml certifies the earlier source statements. The separate ledger/oct13.yaml
    certifies every labeled current-paper result, the simultaneous crossing and common-event probability
    producers, and full contact and separated-bracket source closures. All introduction headline parts
    have Mathlib-only comparator challenges and built solutions in CERWAudit/.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
  - propext
  - Classical.choice
  - Quot.sound
  main_results:
  - declaration: CERW.LimitShapes.limit_shape
    file: CERW/LimitShapes/Frozen/LimitShape.lean
    sorry_count: 0
    axioms:
    - propext
    - Classical.choice
    - Quot.sound
    comparator_config: CERWAudit/LimitShape/comparator.json
  open_mathematics: []
  comparator_configs:
  - CERWAudit/LimitShape/comparator.json
  - CERWAudit/FluctuationRates/comparator.json
  - CERWAudit/Sharpness/comparator.json
  - CERWAudit/NormShape/comparator.json
fidelity:
  divergences: CORRESPONDENCE.md records how each registered statement reads the paper; PROOF.md lists
    the points at which the formalized statements differ from the published text.
acknowledgements: Built on Lean 4, Mathlib, Lake and the shared Lattice-Probability library.
