# CERW frozen-statement manifest.
#
# One entry per frozen declaration.  The bytes between the FROZEN-STATEMENT
# markers are the contract: a proof may be written after the end marker, never
# inside the block.  `frozen_sha256` is the SHA-256 of exactly those bytes.
#
# The pinned paper is paper/limit-shapes.tex, the text of the paper.  Every
# statement is sourced to that file; there is no second version.
#
# States: FROZEN (a cited result carried as a hypothesis, nothing to prove here),
#         DRAFT_SORRY (statement frozen, proof is the one registered `sorry`),
#         SEALED (a proof exists and its axiom closure is clean),
#         PROVED (SEALED and independently audited).

