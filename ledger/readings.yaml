# Mathematical correspondence and quantifier conventions.
clauses:
  thm-shape: 'The walk is any process \texttt{X} on any probability space $(\Omega,\mu)$ with \texttt{CERW.IsCERW
    μ ε X} ($\varepsilon=\kappa$); $d\ge2$ is \texttt{hd : 2 ≤ d} and $0<\kappa<1/d$ is \texttt{hε, hεd}.
    $\omega_d$ is \texttt{(volume (ball 0 1)).toReal} and $r_n$ is the \texttt{let} \texttt{r}, with the
    natural-number casts taken in $\mathbb R$. $\ell_n$ is \texttt{CERW.localTime} and $A_n$ is \texttt{CERW.departureRange}
    (coerced to a \texttt{Set}), so $A_n=\{X_0,\dots,X_{n-1}\}$ as in the paper. ``Almost surely'''' is
    a single \texttt{∀ᵐ ω ∂μ} over the conjunction of (i)--(iii), with the quantifier over $\eta$ inside
    it. (i) is ``for every $0<\eta<1$, eventually'''' with the two inclusions. (ii) ``$\frac1{r_n}\max_x|\cdot|\to0$''''
    is read as $\forall\eta>0$, eventually in $n$, $\forall x$, $|\ell_n(x)-2d\kappa\max(r_n-|x|,0)|\le\eta
    r_n$ (for $|x|\ge r_n$ outside the range both $\ell_n(x)$'
  thm-fluctuations: 'Parameters $d,\kappa,p$ precede the constant, which precedes the probability space:
    the Lean order is \texttt{hd, ε, p, ∃ C > 0, ∀ Ω μ X}, matching $C(d,\kappa,p)$. \texttt{Good C Y
    n} is the conjunction of the three parts (i)--(iii) for the path $Y$ at time $n$, with the $d=2$ /
    $d\ge3$ split written as \texttt{if d = 2 then … else …} (so the \texttt{else} branch is $d\ge3$ under
    \texttt{hd}); \texttt{CERW.innerRadius} is $\inf_{y\notin D_n}|y|$, \texttt{CERW.maxRadius} is $\max_{0\le
    j\le n}|X_j|$, \texttt{CERW.cellSet} is $D_n=\bigcup_{x\in A_n}C_x$, and the maximum over $x\in\mathbb
    Z^d$ in (iii) is a universally quantified bound. The volume $|r_n^{-1}D_n\mathbin\triangle B(0,1)|$
    is \texttt{volume (((r n)⁻¹ • cellSet Y n) ∆ ball 0 1)}: the scaling applies to $D_n$ only .'
  thm-sharp-radii: '$d=2$ is \texttt{hd : d = 2}; $\kappa\in(0,1/d)$ is \texttt{ε}; $r_n$, $\omega_d$
    as in thm-shape. The order is $\forall p>0,\ \exists c>0,\ \exists n_0,\ \forall(\Omega,\mu,X)$ with
    \texttt{IsCERW}, $\forall n\ge n_0$, which reads ``for every $p$ there is $c(\kappa,p)>0$ such that
    for all sufficiently large $n$'''': $c$ and $n_0$ are fixed before the probability space (they may
    be taken so, because the events depend only on the path and the law of the path is determined by \texttt{IsCERW}).
    $r_n-R_{\rm in}(n)\ge c\sqrt{r_n\log n}$ is \texttt{c * √(r n * log n) ≤ r n - innerRadius (X · ω)
    n}, and $R_{\rm out}(n)-r_n\ge\dots$ is the analogous set with \texttt{maxRadius}. A lower bound on
    a probability is written with \texttt{MeasurableSet E} and $\mathrm{ofReal}(n^{-p})\le\mu E$ (repository
    convention). Both displays of \eqref{eq:planar-polynomial-lower} are conjuncts of the same node. No'
  thm-sharp-radii-lil: The statement assumes d = 2 and 0 < ε < 1/d. Both lower bounds are under one almost-sure
    quantifier. For each δ > 0, each radius deviation is at least (1/√(10πε) − δ)√(r_n log log n) infinitely
    often. This is equivalent to the two displayed limsup bounds because the normalizer is positive for
    n ≥ 3. Stout's law is proved by CERW.Generic.Martingale.LilAssembly.stout_lower and supplied in the
    proof; it is not a hypothesis of the registered theorem.
  thm-sharp-bulk: '$d\ge2$ is \texttt{hd : 2 ≤ d}, $\kappa$ is \texttt{ε} with $0<\kappa<1/d$. The constant
    $c(d,\kappa)>0$ and the threshold $n_0$ are bound after $d,\kappa$ and before the probability space;
    the same $c$ appears as the multiplier in the deviation threshold and in the exponent of the probability,
    exactly as in the paper. The maximum over $\{x\in\mathbb Z^d:|x|\le r_n^{1/2}\}$ (a finite nonempty
    set, it contains $0$) being $\ge c\,\phi_n$ is \texttt{∃ x, euclidNorm x ≤ √(r n) ∧ c * φ n ≤ |ℓ_n(x)
    - 2dε(r n - |x|)|}, with $\phi_n=\sqrt{r_n}\log n$ if $d=2$ and $\sqrt{r_n\log n}$ otherwise (\texttt{if
    d = 2 then … else …}). ``With probability at least $1-n^{-c}$'''' is an upper bound $n^{-c}$ on the
    outer measure of the complement (repository convention). No positive part appears in the paper, none
    in Lean (for $|x|\le r_n^{1/2}<r_n$ it would not'
  thm-sharp-width: 'The statement covers all (iv)(a), (iv)(b) and (iv)(c). The
    dimension is d=2; 0<eps<1/d is explicit. The polynomial lower bound chooses c>0 and n0 after p>0 and
    before all probability spaces and walks. The iterated-logarithm lower bound is the junk-free almost-
    sure frequent-time assertion with every positive slack. The third conjunct is the ENNReal limsup of
    the actual width-event probability for every a>=0, bounded by ofReal(1-exp(-(3*eps*a^2/pi))). No CLT,
    LIL or output premise is assumed. '
  thm-norm-shape: 'Paper macros: \verb!\drift! is $\kappa$ (Lean \verb!ε!), \verb!\gauge! is $\Psi$ (Lean
    \verb!Ψ!), \verb!\nf{a}{b}! is $a/b$. \emph{Object mapping.} \begin{itemize} \item $\R^d$ is \verb!EuclideanSpace
    ℝ (Fin d)!; $\Z^d$ is \verb!LatticeProb.Site d! ($=$ \verb!Fin d → ℤ!), embedded by \verb!CERW.toSpace!,
    so $\gauge(x)$ for a site $x$ is \verb!Ψ (CERW.toSpace x)!; $e_i$ is \verb!CERW.coordVec i!. The standing
    assumption $d\ge2$ (lines 85 and 104) is \verb!hd : 2 ≤ d!. \item $\gauge$ a norm: \verb!hΨ : CERW.IsNorm
    Ψ! (subadditive, absolutely homogeneous, zero only at $0$). Nonnegativity, evenness and Lipschitz
    continuity follow (Lipschitz is machine-checked), so $|B_\gauge|$ is finite and positive. \item Chosen
    subgradients: \verb!ξ : Site d → EuclideanSpace ℝ (Fin d)! with \verb!hξ : ∀ x, x ≠ 0 → CERW.IsSubgradient
    Ψ (CERW.toSpace x) (ξ x)!. \verb!IsSubgradient Ψ x ξ! is $\forall y,\'
  lem-ballpotential: 'Paper macros: \verb!\drift! is $\kappa$ (Lean \verb!ε!), \verb!\gauge! is $\Psi$.
    \emph{Object mapping.} \begin{itemize} \item $\gauge$: \verb!Ψ! with \verb!hΨ : CERW.IsNorm Ψ!; $\rho>0$:
    \verb!{ρ : ℝ} (hρ : 0 < ρ)!; $y\in\R^d$: \verb!y : EuclideanSpace ℝ (Fin d)!; $d\ge2$ (standing):
    \verb!hd : 2 ≤ d!. \item $U_D$ of eq:potential-norm is \verb!CERW.normPotential d ε Ψ D y := 2 * ε
    / unitBallVolume d * ∫ v in D, inner ℝ (gradient Ψ v) (v - y) / ‖v - y‖ ^ d!, with \verb!unitBallVolume
    d = (volume (Metric.ball 0 1)).toReal! $=\omega_d$ and \verb!‖v - y‖ ^ d! the natural-number power
    $|v-y|^d$; the integrand is $\nabla\gauge(v)\cdot(v-y)/|v-y|^d$. \item $\nabla\gauge$ is Mathlib''s
    \verb!gradient Ψ v!, the gradient where $\gauge$ is differentiable and $0$ elsewhere. A norm is Lipschitz,
    so the non-differentiability set is Lebesgue-null (Rademacher; machine-checked \verb!ae_differentiable!),'
  lem-local: 'Paper macros: \verb!\drift! is $\kappa$ (Lean \verb!ε!), \verb!\gauge! is $\Psi$, \verb!\nf{a}{b}!
    is $a/b$. \emph{Object mapping.} \begin{itemize} \item $\Z^d$, $\R^d$, $\gauge$, $\xi$ and the ellipticity
    condition are as in thm-norm-shape: \verb!Ψ! with \verb!CERW.IsNorm Ψ!; \verb!ε! with \verb!0 < ε!
    and \verb!∀ i, ε * Ψ (CERW.coordVec i) < 1 / d!; \verb!ξ! with \verb!∀ x, x ≠ 0 → CERW.IsSubgradient
    Ψ (CERW.toSpace x) (ξ x)! and \verb!ξ 0 = 0!; \verb!hd : 2 ≤ d!. The dependence of the paper''s $C(d,\kappa,\gauge,p)$
    is exactly the order of these binders. \item The walk with norm $\gauge$: \verb!X : ℕ → Ω → Site d!
    on an arbitrary probability space (\verb!Ω : Type u!, \verb![MeasurableSpace Ω]!, \verb!μ : Measure
    Ω!, \verb![IsProbabilityMeasure μ]!) with \verb!hX : CERW.IsDriftCERW μ ε ξ X!. This says: each \verb!X
    n! is measurable, \verb!X 0 = 0! almost surely, and every cylinder'
  lem-freedman: '\emph{Object mapping.} \begin{itemize} \item ``A real martingale $Z$'''' is \verb!Z :
    ℕ → Ω → ℝ! with \verb!Martingale Z ℱ μ! for a filtration \verb!ℱ : Filtration ℕ m0! on an arbitrary
    probability space \verb!(Ω, m0, μ)! (\verb![IsProbabilityMeasure μ]!). Mathlib''s \verb!Martingale!
    is adaptedness plus $\mathbb E(Z_j\mid\mathcal F_i)=Z_i$ for $i\le j$; it implies integrability of
    every $Z_i$. The lemma does not fix the filtration: it holds for every filtration to which $Z$ is
    a martingale, and $\langle Z\rangle$ is taken with respect to that filtration. \item ``Increments
    have absolute value at most $1$'''' is \verb!∀ᵐ ω ∂μ, ∀ t, |Z (t + 1) ω - Z t ω| ≤ 1! (almost surely,
    for all times; martingales are defined up to null sets). \item $\langle Z\rangle_n$ is \verb!CERW.predBracket
    μ ℱ Z Z n ω! $=\sum_{t<n}\mathbb E\bigl((Z_{t+1}-Z_t)^2\mid\mathcal F_t\bigr)(\omega)$, the predictable'
  lem-cell: 'Paper macros: \verb!\gauge! is $\Psi$. \emph{Object mapping.} \begin{itemize} \item $\gauge$,
    $\xi$: \verb!Ψ! with \verb!CERW.IsNorm Ψ!, and \verb!ξ : Site d → EuclideanSpace ℝ (Fin d)! with \verb!∀
    x, x ≠ 0 → CERW.IsSubgradient Ψ (CERW.toSpace x) (ξ x)! and \verb!ξ 0 = 0! (line 303). The hypothesis
    \verb!ξ 0 = 0! is essential here: the lemma is asserted for every $x\in\Z^d$ including $x=0$, where
    $\xi(0)=0$ is a subgradient because $\gauge\ge0$ (paper proof, line 462). \verb!hd : 2 ≤ d! is the
    standing assumption. \item $C_x$ is \verb!CERW.cell x! $=\{v:\ \forall i,\ x_i-\tfrac12\le v_i<x_i+\tfrac12\}$
    (half-open cube; the half-open or closed choice is immaterial for the Lebesgue integral). $B(x,6\sqrt
    d)$ is the open ball \verb!Metric.ball (CERW.toSpace x) (6 * Real.sqrt d)!. \item $\nabla\gauge(v)$
    is \verb!gradient Ψ v!, the Mathlib gradient (value $0$ where $\gauge$ is not'
  prop-coarse: '\begin{itemize} \item \emph{Setting.} $d\ge2$ is \texttt{hd}. $\gauge$ is \texttt{Psi}
    with \texttt{CERW.IsNorm Psi}. $\drift$ is \texttt{eps} with $0<\drift$, and eq:ellipticity is written
    \texttt{forall i, eps * Psi (coordVec i) < 1/d} (the maximum over $i$ is the universal quantifier).
    $r_n$ is the \texttt{let}-bound $r\,n=\bigl((d+1)n/(2d\,\drift\,|B_\gauge|)\bigr)^{1/(d+1)}$ of eq:radius-norm,
    where $|B_\gauge|=$ \texttt{normBallVolume Psi} $=(\mathrm{vol}\{\gauge<1\}).\texttt{toReal}$ for
    Lebesgue measure on \texttt{EuclideanSpace R (Fin d)}. All casts are to \texttt{R} (checked with \texttt{pp.coercions}).
    \item \emph{Subgradients.} $\xi(x)\in\partial\gauge(x)$ for $x\ne0$ is \texttt{IsSubgradient Psi (toSpace
    x) (xi x)}, that is $\gauge(y)\ge\gauge(x)+\xi(x)\cdot(y-x)$ for all $y$. $\xi(0)=0$ is line 303.
    \item \emph{Walk.} \texttt{IsDriftCERW mu eps xi X}: $X_0=0$ almost surely'
  lem-crossing: 'For d>=2, every norm Psi, positive drift and the coordinate ellipticity condition, each
    p>0 determines C>0 before all subgradient fields and laws. The vector event uses the literal Z_t=X_t+eps
    sum I_j xi(X_j), contains all s<t<=n bounds, and has complement measure at most C*n^(-p). On it, for
    every unit u and interval whose first- departure drift projections are nonnegative, the crossing is
    bounded by the same C*sqrt((t-s)*log n). Actual IsDriftCERW laws are supplied by existing existence
    proofs. Complete contract: ledger/nl/lem-crossing.tex.'
  prop-norm-shape: '\begin{itemize} \item \emph{Setting and constants.} As in the coarse-bounds twin.
