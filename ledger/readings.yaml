  lem-separated-brackets: >-
    Independent refute-first reading: PASS (ledger/audits/prefreeze-reading-limit-laws.md).
    \emph{Conventions.} \verb!ε! is the paper's $\drift=\kappa$; \verb!hd : 2 ≤ d!, \verb!0 < ε!,
    \verb!ε < 1 / d! are the standing assumptions $d\ge2$, $0<\drift<1/d$. $\omega_d$ is
    \verb!(volume (Metric.ball 0 1)).toReal! (as \verb!CERW.unitBallVolume d!). $r_n$ is
    \verb!((d+1) * n / (2 * d * ε * ωd)) ^ (1/(d+1))! (eq:radius), every cast at a leaf (checked
    with \verb!pp.coercions.types!). The walk is \verb!CERW.IsCERW μ ε X! on an arbitrary
    probability space (universe $u$); \verb!X · ω! is the path $n\mapsto X_n(\omega)$. ``With
    probability at least $1-Cn^{-p}$'' is an upper bound on the outer measure of the exceptional
    set. \emph{Author's ruling (probabilistic closure).} The paper states the bounds ``on $\Omega_n$
    for all large $n$'', where $\Omega_n$ is the event of Section~norm-event with $p=10$ (line
    1374), so $\P(\Omega_n^c)=O(n^{-10})$. The Lean statement is the closure:
    $\exists\,c_0,C_0,C,n_0$ such that for every walk and every $n\ge n_0$ the set of paths on which
    some bracket bound fails has measure at most $C\,n^{-10}$ (the reading approved as G3 in
    \verb!ledger/approval/REVISED-SURFACE.md!). The constants $0<c_0\le C_0$, $C>0$ and $n_0$ depend
    on $(d,\varepsilon)$ only and precede the probability space; \verb!∃ n₀! is existential, so no
    junk value for small $n$ ($\sigma_n=0$ or $m_n=0$) can make the statement easier. \emph{The
    inclusion on the event is not part of the registered type.} The lemma's assertion on $\Omega_n$
    itself is a separate theorem,
    \verb!CERW.Support.Lower.SeparatedBracketsCarrier.separated_brackets_on_source_event!: with
    constants chosen before the probability space, the walk and $n$, for \verb!IsCERW μ ε X! and
    $n\ge n_0$, the event $\Omega_n$ is $\mathcal F_n$-measurable and equals the event \verb!E7! of
    \verb!Section5Localization! (the seven estimates at the nearest-point projection $\Pi_n$, which
    is the only map into $\{|y|\le r_n\}$ with $(z-\Pi_nz)\cdot(y-\Pi_nz)\le0$ for $|y|\le r_n$),
    its complement has probability at most $C_pn^{-10}$, the non-legal sample points are null, and
    at every legal sample point of $\Omega_n$ the bracket bounds $c_0\le\langle S^i\rangle_n\le C_0$
    and $|\langle S^i,S^j\rangle_n|\le Cr_n^{-1/4}$ hold.
    \verb!CERW.Support.Lower.SeparatedBracketsEvent.separated_brackets_on_E7_of_isCERW! is the same
    inclusion for the event \verb!E7! of the drift field $x\mapsto x/|x|$.
