    Retired (ruling D6, 2026-10-01): proved as \texttt{CERW.Generic.Martingale.CLT.martingaleCLT\_proved}; no longer a registered External.
  ext-stout-lil: >-
    Independent refute-first reading: PASS (ledger/audits/prefreeze-reading-introduction.md). The
    cited result, as I read it (Stout, \emph{A martingale analogue of Kolmogorov's law of the
    iterated logarithm}, Z.~Wahrsch.\ verw.\ Gebiete 15 (1970), 279--290, Theorem~1; I recall the
    same statement as Theorem~4.8 of Hall--Heyde 1980, the number recalled from memory and not
    checked): for a zero-mean square-integrable martingale $S_n=\sum_{i\le n}X_i$ with conditional
    variance sums $s_n^2=\sum_{i\le n}E[X_i^2\mid\mathcal F_{i-1}]\to\infty$ a.s., if $|X_n|\le
    K_n$ with $K_n$ $\mathcal F_{n-1}$-measurable and $K_n=o\big(s_n/(\log\log s_n^2)^{1/2}\big)$
    a.s., then $\limsup S_n/(2s_n^2\log\log s_n^2)^{1/2}=1$ a.s. I am not certain from memory of
    the exact hypothesis wording of the original theorem (in particular whether the paper's
    predictable bound or a weaker form is stated there); the Lean Prop is the form the paper
    itself verifies at lines 1246--1252. \texttt{S} is the martingale
