  ext-martingale-clt: >-
    Independent refute-first reading: PASS (ledger/audits/prefreeze-reading-introduction.md). The
    cited result, as I read it (Hall--Heyde, \emph{Martingale limit theory and its application},
    1980, Cor.~3.1): for a zero-mean square-integrable martingale array $(S_{ni},\mathcal
    F_{ni})_{1\le i\le k_n}$ with differences $X_{ni}$, if for every $\delta>0$
    $\sum_iE[X_{ni}^2\mathbf 1_{|X_{ni}|>\delta}\mid\mathcal F_{n,i-1}]\to0$ in probability,
    $\sum_iE[X_{ni}^2\mid\mathcal F_{n,i-1}]\to\eta^2$ in probability for an a.s.\ finite
    $\eta^2$, and the $\sigma$-fields are nested ($\mathcal F_{n,i}\subseteq\mathcal F_{n+1,i}$; I
    believe this is not needed for constant $\eta^2$), then $S_{nk_n}\to Z$ in distribution with
    characteristic function $E\exp(-\tfrac12\eta^2t^2)$. The Lean Prop is the special case
