  lem-near-far: 'Standing assumptions: \verb!hd : 2 ≤ d!, \verb!0 < ε!, \verb!ε < 1 / d! ($\drift=\varepsilon$).
    $U_D^+$ (line 966) is \verb!CERW.positivePotential d ε D y! $=\frac{2\varepsilon}{\omega_d}\int_D\max\{u_v\cdot(v-y)|v-y|^{-d},0\}\,dv$,
