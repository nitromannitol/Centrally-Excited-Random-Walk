    Inner radius.} $\inf_{y\notin D_n}\gauge(y)=$ \texttt{normInnerRadius Psi (X . w) n} $=\texttt{sInf}\,(\gauge''''(D_n)^{\complement})$
    with $D_n=$ \texttt{cellSet} the union of the half-open unit cells of'
  lem-layer: '\begin{itemize} \item \emph{Setting.} $d\ge2$ is \texttt{hd}; $\gauge$ is \texttt{Psi} with
    \texttt{IsNorm Psi}; $\drift$ is \texttt{eps} with $0<\drift$. The declaration does not assume eq:ellipticity:
    the proof (polar coordinates about $y$, convexity of $t\mapsto\gauge(y+tu)$, change of variables $s=h_u(t)$)
    never uses it, so this is the paper''s lemma for a wider class of $\drift$. $\drift>0$ is needed,
    because the right side $2d\drift a$ would be negative otherwise. There are no constants and no probability
    space. \item \emph{Shell.} $b\ge0$ and $a>0$ are reals (\texttt{hb}, \texttt{ha}). $D$ is a set of
    \texttt{EuclideanSpace R (Fin d)} with \texttt{MeasurableSet D} (Borel, the repository''s reading
    of ``measurable'''', as in \texttt{potential\_geometry}) and \texttt{D $\subseteq$ \{v | b <= Psi
    v /\ Psi v <= b + a\}}. The shell is bounded (because $\gauge$ is a norm), so no'
  lem-contact: 'For d>=2, every norm and admissible positive drift, the actual nearest projection exists
    uniquely for each time before choice. Each p>0 determines seven positive source-event constants, a
    positive contact bound and n0>=2 before xi,law,time and projection. The event is the literal conjunction
    of coarse, local, vector, local-martingale, quadratic, radial and projected halfspace bounds. It contains
    no extra future-legality clause. Its complement has the stated polynomial measure bound; almost surely
    on it all contact points, defined by the genuine norm infimum and closure of the complement of the
    visited-cell set, satisfy the potential bound C*r_n*q_n. Law legality is separate and almost sure.
    The old probability statement is a proved consequence, not a substituted source event. Complete contract:
    ledger/nl/lem-contact.tex.'
  lem-outer-crossing: 'For d>=2, a norm, positive drift, coordinate ellipticity and p>0, the finite radial-vector/level
    family and vector event are produced with one event constant before all fields and laws. The separate
    deterministic implication quantifies every alpha>0 and chooses its bound before xi,n,q and the legal
    path; |q|<=normMax Psi, maximality, the vector bound, every source grid-level ramp bound and the drift-alpha
    condition are explicit. It concludes the original T bound for all b>=0. No simultaneous arbitrary-real-q
    probability event is claimed. The legal carrier is explicit; arbitrary IsDriftCERW paths are legal
    almost surely. Complete contract: ledger/nl/lem-outer-crossing.tex.'
