    F_{ni})_{1\le i\le k_n}$ with differences $X_{ni}$, if for every $\delta>0$
    $\sum_iE[X_{ni}^2\mathbf 1_{|X_{ni}|>\delta}\mid\mathcal F_{n,i-1}]\to0$ in probability,
