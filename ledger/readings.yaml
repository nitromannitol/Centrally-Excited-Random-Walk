  lem-exp-deviation: 'For 0<c0<=C0 choose c,C>0 before the probability space, common filtration, m,n>0,
    b>0, delta>=0, 0<=alpha<=1 and family S. Each S_i is strongly measurable and integrable through n
    and satisfies the conditional martingale identity before n. Its start and increment bounds are almost
    sure. PredBracket is the actual predictable covariation; diagonal bounds and off-diagonal bounds on
    the measurable event are almost sure. For every beta>=C with beta*b<=c, both signed tail lower bounds
    hold; with off-diagonal control and beta^2*delta+beta^3*b<=1 the original many-site bound holds. No
    law, tail, summability or ultimate conclusion is assumed. The nonempty-window fair-coin model supplies
    a real many-site consumer. Finite-filtration extension and restriction remain proved support. Complete
    contract: ledger/nl/lem-exp-deviation.tex.'
  prop-bulk-profile: '\emph{Conventions.} \verb!ε! is the paper''s $\drift=\kappa$; \verb!hd : 2 ≤ d!,
    \verb!0 < ε!, \verb!ε < 1 / d! are the standing assumptions $d\ge2$, $0<\drift<1/d$. $\omega_d$ is
    \verb!(volume (Metric.ball 0 1)).toReal! (as \verb!CERW.unitBallVolume d!). $r_n$ is \verb!((d+1)
    * n / (2 * d * ε * ωd)) ^ (1/(d+1))! (eq:radius), every cast at a leaf (checked with \verb!pp.coercions.types!).
    The walk is \verb!CERW.IsCERW μ ε X! on an arbitrary probability space (universe $u$); \verb!X · ω!
    is the path $n\mapsto X_n(\omega)$. ``With probability at least $1-Cn^{-p}$'''' is an upper bound
    on the outer measure of the exceptional set. \emph{Quantifiers.} $\forall\theta\in(0,1)$, $\forall
