name: CI

# Builds the project and the Mathlib-only comparator surface on GitHub-hosted runners
# (`ubuntu-latest`) on each main-branch change to the Lean sources or the build configuration.
# No `pull_request` trigger: the cached `.lake` trees are the artifacts every later gate trusts.
on:
  push:
    branches: [main]
    paths:
      - '**/*.lean'
      - 'CERWAudit/**'
      - 'tools/**'
      - 'ledger/**'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - 'formalization.yaml'
      - 'paper/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, warning gate
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Reclaim runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /usr/local/share/powershell \
                      /usr/share/swift /usr/local/share/boost || true
          df -h /

      - name: Set up Lean and fetch the Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          build: false
          use-mathlib-cache: true

      - name: Restore project build artifacts
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: lake-proj-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-proj-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Enforce warning-free production build
        shell: bash
        run: |
          set -o pipefail
          lake build 2>&1 | tee production-build.log
          if grep -iE '^warning:|declaration uses .sorry|Try this' production-build.log; then
            echo "Production build emitted a warning or a linter suggestion."
            exit 1
          fi

      - name: Build the Mathlib-only comparator surface
        shell: bash
        run: |
          set -o pipefail
          lake build CERWAudit 2>&1 | tee comparator-build.log
          # The only warnings allowed are the intentional statement-level holes of the challenges.
          if grep -E '^warning:' comparator-build.log \
               | grep -vE '^warning: CERWAudit/[A-Za-z]+/Challenge[.]lean:[0-9]+:[0-9]+: declaration uses .sorry.$' \
             || grep -E 'Try this' comparator-build.log; then
            echo "The comparator surface emitted a warning other than the challenge holes."
            exit 1
          fi

      - name: Check both source manifests and axiom certificates
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install ./tools/leanform
          .venv/bin/python -m leanform_tools.verify .
          .venv/bin/python tools/verify_current.py

      - name: Check the challenge vocabulary is Mathlib-only and self-consistent
        env:
          PYTHON: .venv/bin/python
        run: |
          bash CERWAudit/check_standalone.sh --vocabulary

      - name: Check the axiom closure of every production declaration
        run: lake env lean tools/AllAxioms.lean

      - name: Replay every declaration of CERW and its LatticeProb imports in the kernel
        run: bash tools/replay_kernel.sh

      - name: Check the elaborated types of the frozen statements
        run: |
          lake env lean tools/FrozenTypes.lean
          .venv/bin/python tools/check_frozen_types.py

      - name: Save project build artifacts
        if: always() && steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: lake-proj-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
